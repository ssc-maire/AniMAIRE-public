# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Sync CITATION.cff"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'release' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'workflow_run'
      )

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      if: github.event_name == 'release'
    - uses: actions/checkout@v6
      if: github.event_name == 'workflow_run'
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
    - name: Build package
      run: python -m build --wheel
    - name: Check package metadata
      run: python -m twine check dist/*
    - name: Verify wheel contains Python source
      run: |
        python << 'PYEOF'
        import zipfile, glob, sys

        wheels = glob.glob('dist/*.whl')
        if not wheels:
            print('ERROR: No wheel found in dist/')
            sys.exit(1)

        whl = wheels[0]
        print(f'Inspecting: {whl}')
        with zipfile.ZipFile(whl) as z:
            names = z.namelist()

        required = ['AniMAIRE/__init__.py', 'AniMAIRE/AniMAIRE.py']
        missing = [f for f in required if f not in names]
        if missing:
            print('ERROR: Wheel is missing required Python source files:', missing)
            print('Wheel only contains:', sorted(set(n.split('/')[0] for n in names)))
            sys.exit(1)

        py_count = sum(1 for n in names if n.endswith('.py') and n.startswith('AniMAIRE/'))
        print(f'OK: wheel contains {py_count} Python source files (verified {required})')
        PYEOF
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
